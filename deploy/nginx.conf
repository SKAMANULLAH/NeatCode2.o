# Nginx Configuration for neat-code.online
# Place or symlink this file to /etc/nginx/sites-available/neat-code.online

server {
    listen 80;
    server_name neat-code.online www.neat-code.online;

    # Allow up to 20MB uploads (matches Express limit)
    client_max_body_size 20M;

    # Frontend React Static Files
    root /var/www/neatcode/frontend/dist;
    index index.html;

    # Allow Let's Encrypt ACME challenge (prevents SPA index.html fallback)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Serve static frontend and handle React Router SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy to PM2 Express Backend (Port 3000)
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets (CSS, JS, images, fonts)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Custom 404 fallback to index.html for SPA
    error_page 404 /index.html;
}
